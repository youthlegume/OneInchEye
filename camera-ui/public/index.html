<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=480, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Open Source Optics</title>
    <style>
      @font-face {
        font-family: "Suisse BP Int'l";
        src: url("/fonts/SuisseBPIntl-Medium.otf") format("opentype");
        font-weight: 500;
        font-style: normal;
        /* Bundled + offline, so block briefly rather than flash a fallback */
        font-display: block;
      }

      :root {
        /* Warmer, slightly darker than the Paper "Splash" yellow (#fae44c)
           to counter how bright the backlight renders it. Tune to taste:
           lighter/cooler #F3CE3C  ·  this #ECB733  ·  deeper/oranger #E5A627 */
        --yellow: #ecb733;
        --ink: #000000;
        /* Slow, constant motion → linear (web-animation-design) */
        --scan-duration: 9s;
        /* Compensate for the panel's horizontal mode offset (content sits too
           far right on the glass). Negative = shift left. Tune in ~4px steps. */
        --nudge-x: -16px;
        --nudge-y: 0px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--yellow);
        color: var(--ink);
        /* Crisper type on the panel (make-interfaces-feel-better #8) */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        -webkit-user-select: none;
        /* Kiosk: no pointer */
        cursor: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Re-center content on the round glass (see --nudge-* above).
           Background lives on <body>, so this only moves the ring + wordmark. */
        transform: translate(var(--nudge-x), var(--nudge-y));
      }

      /* Focus ring: a faint static track + one thin arc that scans around it.
         Inset well within the 480px circle so the bezel never crops it. */
      .ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .ring__track {
        fill: none;
        stroke: rgba(0, 0, 0, 0.08);
        stroke-width: 2;
      }

      .ring__scan {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2;
        stroke-linecap: round;
        transform-box: fill-box;
        transform-origin: center;
        /* Only transform is animated → composited on the GPU */
        animation: scan var(--scan-duration) linear infinite;
        will-change: transform;
      }

      @keyframes scan {
        to {
          transform: rotate(360deg);
        }
      }

      .wordmark {
        position: relative;
        z-index: 1;
        /* Single line, matching the Paper design */
        white-space: nowrap;
        text-align: center;
        color: var(--ink);
        font-family: "Suisse BP Int'l", "Helvetica Neue", Helvetica, Arial,
          "Liberation Sans", system-ui, sans-serif;
        font-weight: 500;
        /* Sized so the one-line wordmark sits comfortably inside the ring */
        font-size: 40px;
        line-height: 1.04;
        /* Tighter tracking on large type, matching the design */
        letter-spacing: -0.02em;
      }

      /* Respect users who prefer no motion */
      @media (prefers-reduced-motion: reduce) {
        .ring__scan {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="ring" viewBox="0 0 480 480" aria-hidden="true">
        <circle class="ring__track" cx="240" cy="240" r="206" />
        <circle
          class="ring__scan"
          cx="240"
          cy="240"
          r="206"
          stroke-dasharray="64 1230"
        />
      </svg>
      <h1 class="wordmark">Open Source Optics</h1>
    </div>
  </body>
</html>
