<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=480, height=480, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>OneInchEye</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: 1rem;
        text-align: center;
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      p {
        font-size: 0.85rem;
        opacity: 0.65;
        max-width: 18rem;
        line-height: 1.4;
      }

      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #3dffb5;
        box-shadow: 0 0 0.75rem #3dffb5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>OneInchEye</h1>
      <p>Kiosk boot OK. Replace this page with live preview and ISO / shutter controls.</p>
    </main>
  </body>
</html>
